[project]
name = "kopsusren-po"
version = "0.0.0"
description = "KopSusRen pre-order system scaffold"
requires-python = ">=3.12.3,<3.13"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
